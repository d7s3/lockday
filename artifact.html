<title>Lockday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Badeen+Display&family=Beiruti:wght@200..900&display=swap">
<style>
/* Layout: a living sky over the desert opens the notebook (it follows the real hour), then one phone column of glassy cards: pulse, dictation, focus timer, meeting tickets, task tiles drawn from each task's own words, AI help, today's wins. */
:root{
  --bg:oklch(97.4% .007 240); --bg2:oklch(94.2% .011 240); --surface:oklch(100% 0 0); --ink:oklch(23% .03 255);
  --muted:oklch(52% .025 250); --line:oklch(90.5% .012 245);
  --work:oklch(54% .16 258); --biz:oklch(67% .16 60); --personal:oklch(60% .12 165); --spark:oklch(60% .2 305); --ws:oklch(53% .2 285); --on-a:#fff; --ws-strong:oklch(50% .2 285);
  --bad:oklch(57% .2 27); --bad-soft:oklch(95.5% .03 27); --ok:oklch(57% .13 155); --warn:oklch(64% .14 70);
  --glass:color-mix(in oklab,var(--surface) 74%,transparent);
  --shadow:0 1px 2px oklch(20% .03 255/.05),0 10px 30px -14px oklch(20% .04 255/.22);
  --display:"Thmanyah Serif Display","Thmanyah Sans","Badeen Display","Beiruti",system-ui,sans-serif;
  --sans:"Thmanyah Sans","Thmanyah Serif Text","Beiruti","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:20px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:oklch(16.5% .02 262); --bg2:oklch(21% .022 262); --surface:oklch(22% .023 262); --ink:oklch(94% .01 250);
  --muted:oklch(70% .02 250); --line:oklch(30% .025 262);
  --work:oklch(71% .14 255); --biz:oklch(79% .14 70); --personal:oklch(76% .12 165); --spark:oklch(73% .17 305); --ws:oklch(70% .16 285); --on-a:oklch(18% .03 262); --ws-strong:oklch(50% .2 285);
  --bad:oklch(70% .17 27); --bad-soft:oklch(29% .07 27); --ok:oklch(76% .13 155); --warn:oklch(81% .13 80);
  --shadow:0 1px 2px oklch(0% 0 0/.3),0 12px 32px -14px oklch(0% 0 0/.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:oklch(16.5% .02 262); --bg2:oklch(21% .022 262); --surface:oklch(22% .023 262); --ink:oklch(94% .01 250);
  --muted:oklch(70% .02 250); --line:oklch(30% .025 262);
  --work:oklch(71% .14 255); --biz:oklch(79% .14 70); --personal:oklch(76% .12 165); --spark:oklch(73% .17 305); --ws:oklch(70% .16 285); --on-a:oklch(18% .03 262); --ws-strong:oklch(50% .2 285);
  --bad:oklch(70% .17 27); --bad-soft:oklch(29% .07 27); --ok:oklch(76% .13 155); --warn:oklch(81% .13 80);
  --shadow:0 1px 2px oklch(0% 0 0/.3),0 12px 32px -14px oklch(0% 0 0/.6); color-scheme:dark}

/* skins: الحبر (ink), الليل (night), الحديقة (garden); الصحراء is the default above */
:root[data-skin="ink"]{--bg:#fff;--bg2:#f1f1f1;--surface:#fff;--ink:#111;--muted:#6b6b6b;--line:#e3e3e3;
  --work:oklch(45% .07 258);--biz:oklch(52% .09 60);--personal:oklch(47% .07 165);--spark:oklch(45% .08 305);--ws:oklch(40% .09 285);--ws-strong:oklch(35% .09 285);
  --shadow:0 1px 0 #e3e3e3;--r:12px}
@media (prefers-color-scheme: dark){:root[data-skin="ink"]:not([data-theme="light"]){--bg:#000;--bg2:#161616;--surface:#0e0e0e;--ink:#f3f3f3;--muted:#9a9a9a;--line:#262626;
  --work:oklch(78% .07 258);--biz:oklch(80% .09 60);--personal:oklch(78% .08 165);--spark:oklch(78% .08 305);--ws:oklch(76% .09 285);--on-a:#111;--shadow:none;color-scheme:dark}}
:root[data-skin="ink"][data-theme="dark"]{--bg:#000;--bg2:#161616;--surface:#0e0e0e;--ink:#f3f3f3;--muted:#9a9a9a;--line:#262626;
  --work:oklch(78% .07 258);--biz:oklch(80% .09 60);--personal:oklch(78% .08 165);--spark:oklch(78% .08 305);--ws:oklch(76% .09 285);--on-a:#111;--shadow:none;color-scheme:dark}
:root[data-skin="ink"] body{background:var(--bg)}
:root[data-skin="ink"] .sky{display:none}
:root[data-skin="ink"] .hero{background:var(--ink);color:var(--bg);box-shadow:none;border-radius:var(--r)}
:root[data-skin="ink"] .hero::after{display:none}
:root[data-skin="ink"] .gl,:root[data-skin="ink"] .glass-btn,:root[data-skin="ink"] .hero-streak{background:color-mix(in oklab,var(--bg) 12%,transparent);border-color:color-mix(in oklab,var(--bg) 30%,transparent);color:var(--bg);backdrop-filter:none}
:root[data-skin="ink"] .gl.bad{background:var(--bad)}
:root[data-skin="ink"] .hero h1{font-family:var(--sans);font-weight:800;text-shadow:none}
:root[data-skin="ink"] .card,:root[data-skin="ink"] .box,:root[data-skin="ink"] .list>li,:root[data-skin="ink"] .ticket,:root[data-skin="ink"] .mcard,:root[data-skin="ink"] .tile,:root[data-skin="ink"] .btn,:root[data-skin="ink"] .field,:root[data-skin="ink"] .day,:root[data-skin="ink"] .send,:root[data-skin="ink"] .play,:root[data-skin="ink"] .chk{border-radius:10px}
:root[data-skin="ink"] .tile .pat{display:none}
:root[data-skin="ink"] .run{background:var(--ink);color:var(--bg);box-shadow:none;border-radius:12px}
:root[data-skin="ink"] .run-btns .go{background:var(--bg);color:var(--ink)}
:root[data-skin="ink"] .switch::before,:root[data-skin="ink"] .btn.invite,:root[data-skin="ink"] .send,:root[data-skin="ink"] .send.ws,:root[data-skin="ink"] .btn.grad,:root[data-skin="ink"] .switch[data-v="ws"]::before{background:var(--ink);color:var(--bg)}
:root[data-skin="ink"] .ai-card::before,:root[data-skin="ink"] .box:focus-within::before,:root[data-skin="ink"] .box.thinking::before{background:var(--ink);animation:none}
:root[data-skin="ink"] .ws-head{background:var(--ink)}
:root[data-skin="night"]{--bg:oklch(16.5% .02 262);--bg2:oklch(21% .022 262);--surface:oklch(22% .023 262);--ink:oklch(94% .01 250);--muted:oklch(70% .02 250);--line:oklch(30% .025 262);
  --work:oklch(71% .14 255);--biz:oklch(79% .14 70);--personal:oklch(76% .12 165);--spark:oklch(73% .17 305);--ws:oklch(70% .16 285);--on-a:oklch(18% .03 262);
  --bad:oklch(70% .17 27);--bad-soft:oklch(29% .07 27);--ok:oklch(76% .13 155);--warn:oklch(81% .13 80);--shadow:0 1px 2px oklch(0% 0 0/.3),0 12px 32px -14px oklch(0% 0 0/.6);color-scheme:dark}
:root[data-skin="garden"]{--bg:oklch(97% .018 125);--bg2:oklch(93% .028 125);--surface:#fff;--ink:oklch(26% .04 145);--muted:oklch(50% .04 140);--line:oklch(89% .03 125);
  --work:oklch(50% .11 195);--biz:oklch(62% .14 68);--personal:oklch(54% .13 140);--spark:oklch(56% .12 325);--ws:oklch(50% .12 160);--ws-strong:oklch(45% .12 160)}
@media (prefers-color-scheme: dark){:root[data-skin="garden"]:not([data-theme="light"]){--bg:oklch(18% .025 145);--bg2:oklch(23% .03 145);--surface:oklch(24% .03 145);--ink:oklch(94% .015 130);--muted:oklch(70% .03 135);--line:oklch(32% .03 145);
  --work:oklch(74% .11 195);--biz:oklch(80% .13 70);--personal:oklch(78% .12 140);--spark:oklch(76% .12 325);--ws:oklch(74% .12 160);--on-a:oklch(18% .03 145);--shadow:0 1px 2px oklch(0% 0 0/.3),0 12px 32px -14px oklch(0% 0 0/.6);color-scheme:dark}}
:root[data-skin="garden"][data-theme="dark"]{--bg:oklch(18% .025 145);--bg2:oklch(23% .03 145);--surface:oklch(24% .03 145);--ink:oklch(94% .015 130);--muted:oklch(70% .03 135);--line:oklch(32% .03 145);
  --work:oklch(74% .11 195);--biz:oklch(80% .13 70);--personal:oklch(78% .12 140);--spark:oklch(76% .12 325);--ws:oklch(74% .12 160);--on-a:oklch(18% .03 145);--shadow:0 1px 2px oklch(0% 0 0/.3),0 12px 32px -14px oklch(0% 0 0/.6);color-scheme:dark}
:root[data-font="big"] body{zoom:1.14}
:root[data-font="small"] body{zoom:.92}
:root[data-motion="off"] *,:root[data-motion="off"] *::before,:root[data-motion="off"] *::after{animation:none!important;transition:none!important}

@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
*{box-sizing:border-box}
body{background:
  radial-gradient(70% 38% at 100% 0%,color-mix(in oklab,var(--work) 9%,transparent),transparent 70%),
  radial-gradient(60% 34% at 0% 42%,color-mix(in oklab,var(--biz) 8%,transparent),transparent 70%),
  radial-gradient(60% 30% at 100% 85%,color-mix(in oklab,var(--personal) 8%,transparent),transparent 70%),var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;font-optical-sizing:auto}
.app{max-width:580px;margin:0 auto;padding-inline:16px;padding-block:12px 96px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--work);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[data-area="work"]{--a:var(--work)} [data-area="biz"]{--a:var(--biz)} [data-area="personal"]{--a:var(--personal)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a);display:inline-block;flex:none}

/* ---------- hero sky ---------- */
.hero{position:relative;border-radius:28px;overflow:hidden;color:#fff;min-height:300px;display:flex;isolation:isolate;box-shadow:0 18px 40px -22px oklch(25% .08 260/.55)}
.sky{position:absolute;inset:0;z-index:-1}
.sky svg{width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,oklch(10% .03 260/.42),transparent 48%,transparent 62%,oklch(10% .03 260/.35));pointer-events:none}
.hero-in{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:18px 18px 16px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{margin:0;font-size:13px;font-weight:500;opacity:.92;letter-spacing:.2px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,11vw,54px);line-height:1.1;margin-top:4px;text-shadow:0 2px 18px oklch(10% .05 260/.35)}
.hero .sub{margin:6px 0 0;font-size:15.5px;font-weight:500;opacity:.95;max-width:30ch}
.glass-btn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;flex:none;color:#fff;border:1px solid oklch(100% 0 0/.35);background:oklch(100% 0 0/.16);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%)}
.glass-btn svg{width:21px;height:21px}
.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gl{border-radius:16px;padding:9px 12px;border:1px solid oklch(100% 0 0/.32);background:oklch(100% 0 0/.15);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);display:flex;flex-direction:column;min-width:0}
.gl b{font-size:28px;font-weight:800;line-height:1.15}
.gl span{font-size:12.5px;font-weight:500;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl.bad{background:oklch(58% .2 27/.78);border-color:oklch(80% .12 27/.6)}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.55}}
.star{animation:tw 3.2s ease-in-out infinite}
.cloud{animation:drift 40s linear infinite alternate}
.halo{animation:glow 5s ease-in-out infinite}
@supports (animation-timeline: scroll()){
  .far{animation:pxa linear both;animation-timeline:scroll(root);animation-range:0 340px}
  .near{animation:pxb linear both;animation-timeline:scroll(root);animation-range:0 340px}
  @keyframes pxa{to{transform:translateY(18px)}}
  @keyframes pxb{to{transform:translateY(-8px)}}
}

/* ---------- pulse ---------- */
.pulse{padding:16px;display:flex;flex-direction:column;gap:12px}
.pulse-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.big{display:block;font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.3px}
.week{display:flex;gap:7px;align-items:flex-end;height:66px}
.wk{display:flex;flex-direction:column;align-items:center;gap:4px;width:18px}
.wk .col{width:10px;height:44px;border-radius:6px;background:var(--bg2);display:flex;flex-direction:column-reverse;overflow:hidden}
.wk .col i{display:block;background:var(--a)}
.wk small{font-size:10.5px;color:var(--muted);line-height:1}
.wk.today small{color:var(--ink);font-weight:700}
.bar{display:flex;height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;gap:2px}
.bar i{display:block;background:linear-gradient(90deg,color-mix(in oklab,var(--a),white 18%),var(--a));height:100%;transition:width .6s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:600}

/* ---------- compose ---------- */
.box{position:relative;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);padding:2px}
.box::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--line);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.box:focus-within::before{background:conic-gradient(from var(--ang),var(--work),var(--personal),var(--biz),var(--spark),var(--work))}
.box.thinking::before{background:conic-gradient(from var(--ang),var(--work),var(--personal),var(--biz),var(--spark),var(--work));animation:spinang 1.6s linear infinite}
.box.thinking{box-shadow:0 0 0 6px color-mix(in oklab,var(--spark) 12%,transparent),var(--shadow)}
@keyframes spinang{to{--ang:360deg}}
.box textarea{display:block;width:100%;min-height:104px;resize:none;border:0;background:transparent;padding:16px 18px 6px;outline:none;font-size:17px;line-height:1.75;field-sizing:content;max-height:40vh}
.box-foot{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 10px 10px}
.wave{display:flex;gap:3px;align-items:center;height:22px;padding-inline:8px}
.wave i{width:3px;border-radius:3px;background:var(--muted);opacity:.35;height:6px;transition:height .3s}
.box:focus-within .wave i,.box.thinking .wave i{opacity:.8;animation:wv 1s ease-in-out infinite}
.box:focus-within .wave i:nth-child(1){background:var(--work)} .box:focus-within .wave i:nth-child(2){background:var(--personal);animation-delay:.12s}
.box:focus-within .wave i:nth-child(3){background:var(--biz);animation-delay:.24s} .box:focus-within .wave i:nth-child(4){background:var(--spark);animation-delay:.36s}
.box:focus-within .wave i:nth-child(5){background:var(--work);animation-delay:.48s}
@keyframes wv{0%,100%{height:6px}50%{height:20px}}
.send{width:48px;height:48px;border-radius:16px;border:0;color:#fff;display:grid;place-items:center;background:linear-gradient(135deg,var(--work),var(--spark));box-shadow:0 8px 18px -8px var(--spark);transition:transform .2s var(--ease),opacity .2s}
.send:not(:disabled):active{transform:scale(.92)}
.send:disabled{opacity:.3;cursor:default;box-shadow:none}
.send svg{width:23px;height:23px}
.pstatus{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:15px;color:var(--muted)}
.pstatus:empty{display:none}
.err{color:var(--bad)}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--spark);animation:bob 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s;background:var(--work)} .dots i:nth-child(3){animation-delay:.3s;background:var(--biz)}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}

/* ---------- buttons & fields ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:9px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.grad{background:linear-gradient(135deg,var(--work),var(--spark));color:#fff;border:0}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.field{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:16px;min-width:0;width:100%}
select.field{width:auto}
.field.missing{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.x{border:0;background:var(--bg2);color:var(--muted);width:34px;height:34px;border-radius:11px;font-size:20px;line-height:1;flex:none}
.row-opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--a,var(--ink));border-color:var(--a,var(--ink));color:#fff}
.chip[aria-pressed="true"] .dot{background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:2px;background:var(--bg2)}
.seg button{border:0;background:transparent;padding:4px 13px;font-size:14px;font-weight:500;border-radius:99px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px oklch(20% .03 255/.15)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label{display:flex;flex-direction:column;gap:3px;min-width:0}

/* ---------- review ---------- */
.review{margin-top:14px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1.5px solid color-mix(in oklab,var(--spark) 45%,var(--line))}
.review-h{display:flex;gap:12px;align-items:center}
.review-h svg{width:46px;height:46px;flex:none}
.review-h h2{font-size:19px}
.review-h p{margin:0;font-size:13.5px;color:var(--muted)}
.rv{border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.rv-top{display:flex;gap:8px;align-items:center}
.rv-top .field{flex:1}
.rv-top select.field{flex:none}

/* ---------- day strip ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;width:48px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--muted);scroll-snap-align:start;transition:background .2s,transform .15s var(--ease)}
.day:active{transform:scale(.94)}
.day b{font-size:17px;color:var(--ink);font-weight:700;line-height:1.3}
.day.today{border-color:var(--ink);border-width:1.5px}
.day.wknd{background:var(--bg2)}
.day[aria-pressed="true"]{background:var(--a,var(--ink));border-color:var(--a,var(--ink));color:#fff}
.day[aria-pressed="true"] b{color:#fff}

/* ---------- running ---------- */
.run{position:relative;overflow:hidden;border-radius:26px;padding:18px;color:#F3F5F8;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in oklab,var(--a) 55%,transparent),transparent 60%),radial-gradient(80% 80% at 0% 100%,oklch(45% .15 300/.45),transparent 60%),oklch(19% .03 262);
  box-shadow:0 22px 44px -22px color-mix(in oklab,var(--a) 70%,black)}
.run-top{display:flex;gap:14px;align-items:center}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tile{position:absolute;inset:16px;width:auto;height:auto;border-radius:16px}
.run-k{font-size:13px;color:oklch(85% .02 260);display:flex;align-items:center;gap:8px}
.run-k .live{width:8px;height:8px;border-radius:50%;background:#7CF0B5;box-shadow:0 0 0 0 #7CF0B5;animation:live 1.6s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 oklch(85% .17 155/.7)}100%{box-shadow:0 0 0 10px oklch(85% .17 155/0)}}
.run h3{font-size:19px;font-weight:700;margin-top:2px}
.clock{font-size:58px;font-weight:200;letter-spacing:1px;line-height:1.05;direction:ltr;text-align:right}
.run-btns{display:flex;gap:8px}
.run-btns button{flex:1;border-radius:16px;padding:13px;font-weight:700;font-size:16px;border:1px solid oklch(100% 0 0/.22);background:oklch(100% 0 0/.08);color:#fff;backdrop-filter:blur(10px)}
.run-btns .go{background:#fff;color:oklch(20% .03 262);border-color:#fff}

/* ---------- sections ---------- */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
.sec-h .c{min-width:28px;height:24px;padding:0 8px;border-radius:99px;background:var(--bg2);color:var(--muted);font-size:13px;font-weight:700;display:inline-grid;place-items:center}
.sec-h svg{width:30px;height:30px;flex:none}
.list{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px}
.list>li{border-radius:16px;transition:background .2s}
.list>li.open{background:var(--bg)}
.item{display:flex;align-items:center;gap:12px;padding:8px}
.tile{position:relative;width:48px;height:48px;border-radius:15px;flex:none;overflow:hidden;color:#fff;display:grid;place-items:center;
  background:linear-gradient(140deg,color-mix(in oklab,var(--a),white 22%),var(--a) 55%,color-mix(in oklab,var(--a),black 18%));box-shadow:inset 0 1px 0 oklch(100% 0 0/.35),0 6px 14px -8px var(--a)}
.tile .pat{position:absolute;inset:0;width:100%;height:100%}
.tile .ico{position:relative;width:24px;height:24px;filter:drop-shadow(0 1px 1px oklch(0% 0 0/.25))}
.content{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.main{width:100%;cursor:pointer;background:none;border:0;text-align:start;padding:0}
.t{font-weight:600;font-size:16.5px;line-height:1.45;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}
.atag{display:inline-flex;align-items:center;gap:5px;color:color-mix(in oklab,var(--a),var(--ink) 15%);font-weight:600}
.pill{border-radius:99px;padding:1px 9px;font-size:12.5px;font-weight:600;background:var(--bg2);color:var(--muted)}
.pill.late{background:var(--bad);color:#fff;box-shadow:0 4px 10px -5px var(--bad)}
.pill.today{background:var(--ink);color:var(--bg)}
.pill.unset{background:transparent;border:1px dashed var(--muted)}
.pill.ok{background:color-mix(in oklab,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in oklab,var(--warn) 18%,transparent);color:var(--warn)}
.later{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 40%,transparent);background:var(--bad-soft)}
.acts{display:flex;gap:6px;flex:none}
.play,.chk{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:transform .15s var(--ease),background .2s}
.play:active,.chk:active{transform:scale(.9)}
.play svg,.chk svg{width:18px;height:18px}
.play.on{background:var(--a);border-color:var(--a);color:#fff}
.chk{color:var(--muted)}
@media (hover:hover){.chk:hover{color:#fff;background:var(--ok);border-color:var(--ok)}}
.panel{padding:6px 10px 14px;display:flex;flex-direction:column;gap:10px}
.panel .actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.confirm{background:var(--bad-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.confirm p{margin:0;color:var(--bad);font-weight:700}
.confirm small{color:var(--muted)}
.confirm div{display:flex;gap:8px;flex-wrap:wrap}
.empty-mini{padding:14px;color:var(--muted);font-size:14.5px;text-align:center}

/* meeting tickets */
.tickets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.ticket .item{align-items:stretch;padding:0}
.stub{flex:none;width:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;
  background:linear-gradient(160deg,color-mix(in oklab,var(--a) 22%,var(--surface)),color-mix(in oklab,var(--a) 8%,var(--surface)));border-inline-end:2px dashed color-mix(in oklab,var(--a) 35%,var(--line))}
.stub b{font-size:22px;font-weight:800;direction:ltr;color:color-mix(in oklab,var(--a),var(--ink) 25%)}
.stub span{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.stub.missing b{color:var(--bad)}
.ticket .content{padding:12px 4px 12px 0}
.ticket .acts{align-self:center;padding-inline-end:10px}
.ticket .panel{border-top:1px dashed var(--line);padding-top:12px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;padding:8px;margin-inline:-8px;scrollbar-width:none;
  background:color-mix(in oklab,var(--bg) 70%,transparent);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-radius:20px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 15px;font-size:15px;font-weight:600;display:inline-flex;gap:7px;align-items:center;transition:background .2s,color .2s}
.tabs button[aria-pressed="true"]{background:var(--a,var(--ink));border-color:var(--a,var(--ink));color:#fff}
.tabs button[aria-pressed="true"] .dot{background:#fff}
.tabs .n{font-size:12.5px;opacity:.75}

/* empty hero */
.empty{padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty svg{width:min(260px,80%);height:auto}
.empty b{font-size:20px;font-weight:800}
.empty p{margin:0;color:var(--muted);font-size:15px;max-width:34ch}

/* ai */
.ai-card{position:relative;overflow:hidden}
.ai-card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),var(--spark),var(--work),var(--personal),var(--biz),var(--spark));animation:spinang 8s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ai-head{display:flex;align-items:center;gap:12px;padding:14px 16px 4px}
.ai-head svg{width:52px;height:52px;flex:none}
.ai-head h2{font-size:20px;font-weight:800}
.ai-head p{margin:0;font-size:13.5px;color:var(--muted)}
.ai-row{display:flex;align-items:center;gap:10px;padding:8px}
.ai-row .tile{width:36px;height:36px;border-radius:11px}
.ai-row .tile .ico{width:18px;height:18px}
.ai-row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.ai-kind{font-size:12.5px;color:var(--spark);font-weight:700;flex:none}
.draft{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15.5px;line-height:1.85;min-height:48px;user-select:text;-webkit-user-select:text}
.draft:empty{display:none}
textarea.field{resize:vertical;min-height:76px;line-height:1.7}
.hint{font-size:13px;color:var(--muted);margin:0}

/* done */
details.done{overflow:hidden}
details.done summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
details.done summary::-webkit-details-marker{display:none}
details.done summary svg{width:40px;height:40px;flex:none}
details.done summary .s{flex:1}
details.done summary b{display:block;font-size:18px;font-weight:800}
details.done summary small{color:var(--muted);font-size:13px}
details.done summary::after{content:"";width:10px;height:10px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .25s var(--ease)}
details.done[open] summary::after{transform:rotate(135deg)}
details.done ul{list-style:none;margin:0;padding:0 12px 12px;display:flex;flex-direction:column;gap:2px}
details.done li{display:flex;align-items:center;gap:10px;padding:6px}
details.done li .tile{width:34px;height:34px;border-radius:11px;filter:saturate(.6)}
details.done li .tile .ico{width:16px;height:16px}
details.done li .t{flex:1;min-width:0;text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--muted) 60%,transparent);color:var(--muted);font-weight:500;font-size:15px}

/* settings, banners */
.sheet{padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px;font-weight:800}
.area-set{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:color-mix(in oklab,var(--a) 7%,var(--surface));border:1px solid color-mix(in oklab,var(--a) 22%,var(--line))}
.area-set label{display:flex;flex-direction:column;gap:4px}
.banner{background:var(--bg2);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--muted)}
.banner.wshint{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in oklab,var(--ws) 10%,var(--surface));border:1px solid color-mix(in oklab,var(--ws) 28%,var(--line))}
.banner.wshint b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.banner.wshint span{display:block;line-height:1.6}
.banner.wshint .btn{flex:none}
.namecard{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
.namecard .chips3{display:flex}
.namecard .chips3 i{width:22px;height:22px;border-radius:8px;background:var(--a);border:2px solid var(--surface);margin-inline-start:-6px}
.namecard b{display:block;font-size:17px;font-weight:800}
.namecard span{font-size:14px;color:var(--muted)}

/* toast + fx */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(548px,calc(100% - 32px));background:oklch(22% .03 262/.92);color:#fff;border-radius:18px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;z-index:9;box-shadow:0 14px 30px -12px oklch(0% 0 0/.5);backdrop-filter:blur(12px)}
.toast[hidden]{display:none}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;border:0;background:oklch(100% 0 0/.14);color:#fff;font-weight:700;border-radius:10px;padding:5px 12px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

/* ---------- workspace ---------- */
[data-area="ws"]{--a:var(--ws)}
.view{display:flex;flex-direction:column;gap:22px}
.switch{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.switch::before{content:"";position:absolute;top:5px;bottom:5px;right:5px;width:calc(50% - 5px);border-radius:15px;background:var(--ink);transition:transform .4s var(--ease),background .4s}
.switch[data-v="ws"]::before{transform:translateX(-100%);background:linear-gradient(135deg,var(--ws),color-mix(in oklab,var(--ws),var(--spark) 45%))}
.switch button{position:relative;z-index:1;border:0;background:transparent;padding:11px 8px;border-radius:15px;font-weight:700;font-size:16.5px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);transition:color .3s}
.switch button[aria-pressed="true"]{color:var(--bg)}
.switch[data-v="ws"] button[aria-pressed="true"]{color:#fff}
.mini-stack{display:inline-flex;padding-inline-start:6px}
.mini-stack .av{width:22px;height:22px;font-size:10.5px;margin-inline-start:-7px;border:2px solid var(--surface)}
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;color:#fff;font-weight:800;flex:none;width:34px;height:34px;font-size:14px;object-fit:cover;line-height:1}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.ws-head{position:relative;overflow:hidden;padding:18px;display:flex;flex-direction:column;gap:14px}
.ws-head::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;top:-120px;left:-70px;background:radial-gradient(circle,color-mix(in oklab,var(--ws) 30%,transparent),transparent 70%);pointer-events:none}
.ws-title{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ws-title h2{font-size:28px;font-weight:800;line-height:1.2}
.ws-title p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ws-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;align-items:center}
.stack .stk{position:relative;margin-inline-start:-10px}
.stack .stk:first-child{margin-inline-start:0}
.stack .stk .av,.stack .more{width:38px;height:38px;border:2.5px solid var(--surface);font-size:14px}
.stack .stk.on::after{content:"";position:absolute;bottom:1px;inset-inline-end:1px;width:10px;height:10px;border-radius:50%;background:#3FCB7E;border:2px solid var(--surface)}
.stack .more{margin-inline-start:-10px;background:var(--bg2);color:var(--muted)}
.btn.invite{background:linear-gradient(135deg,var(--ws),color-mix(in oklab,var(--ws),var(--spark) 45%));color:#fff;border:0;box-shadow:0 8px 18px -10px var(--ws)}
.prog-row{display:flex;align-items:center;gap:10px}
.prog-row b{font-size:14px}
.prog{flex:1;height:9px;border-radius:99px;background:var(--bg2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ws),var(--personal));transition:width .6s var(--ease)}
.ws-panel{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px dashed var(--line)}
.ws-panel label{display:flex;flex-direction:column;gap:4px}
.invite-note{background:color-mix(in oklab,var(--ws) 9%,var(--surface));border:1px solid color-mix(in oklab,var(--ws) 25%,var(--line));border-radius:14px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.invite-note span{color:var(--muted)}
.sec-h h2>svg{color:var(--ws)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;box-shadow:var(--shadow);transition:background .35s,color .35s,box-shadow .35s;min-width:0}
.mcard>*:not(.mhit){position:relative;z-index:1}
.mcard>.av,.mcard>b,.mcard>.role,.mcard>.mstats,.mcard>.st{pointer-events:none}
.mhit{position:absolute;inset:0;border:0;background:transparent;border-radius:inherit;z-index:0}
.mcard .st{position:absolute;top:13px;inset-inline-start:13px;width:9px;height:9px;border-radius:50%;background:var(--line)}
.mcard .st.on{background:#3FCB7E;box-shadow:0 0 0 3px color-mix(in oklab,#3FCB7E 28%,transparent)}
.mcard>.av{width:60px;height:60px;font-size:23px;margin-block:4px 6px;box-shadow:0 8px 18px -8px oklch(25% .08 285/.55);border:3px solid var(--surface)}
.mcard b{font-size:16px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.mcard b small{font-weight:500;opacity:.7;font-size:12px}
.mcard .role{font-size:12.5px;color:var(--muted);min-height:1.5em}
.mstats{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:9px;border-top:1px dashed var(--line)}
.mstats .pct{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:700}
.mcard>.btn{width:100%;justify-content:center;margin-top:8px}
.mcard.sel{grid-column:1/-1;color:#fff;border-color:transparent;background:radial-gradient(90% 80% at 0% 0%,color-mix(in oklab,var(--spark) 55%,transparent),transparent 60%),linear-gradient(150deg,color-mix(in oklab,var(--ws),white 6%),color-mix(in oklab,var(--ws),black 14%));box-shadow:0 22px 40px -20px var(--ws)}
.mcard.sel .role,.mcard.sel .mstats{color:oklch(100% 0 0/.82)}
.mcard.sel .mstats{border-color:oklch(100% 0 0/.25);max-width:320px}
.mcard.sel .pct{color:#fff}
.mcard.sel>.av{border-color:oklch(100% 0 0/.5);width:72px;height:72px;font-size:28px}
.qa{display:flex;gap:10px;justify-content:center;margin-top:10px}
.qa button{border:0;background:#fff;color:var(--ws);border-radius:16px;padding:9px 14px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;min-width:70px;box-shadow:0 8px 16px -10px oklch(0% 0 0/.5)}
.qa button[aria-expanded="true"]{background:oklch(100% 0 0/.2);color:#fff}
.medit{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px;margin-top:10px}
.medit .field{background:oklch(100% 0 0/.95);color:oklch(22% .03 262);border-color:transparent}
.mcard.join{border:1.5px dashed var(--ws);background:color-mix(in oklab,var(--ws) 6%,var(--surface));box-shadow:none}
.mcard.join .btn{width:100%;justify-content:center;margin-top:8px}
.ws-compose{padding:14px;display:flex;flex-direction:column;gap:10px}
.ws-compose h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.ws-compose h2 svg{color:var(--ws)}
.ws-box{box-shadow:none;background:var(--bg)}
.ws-box:focus-within::before,.ws-box.thinking::before{background:conic-gradient(from var(--ang),var(--ws),var(--spark),var(--personal),var(--ws))}
.ws-box textarea{min-height:76px;font-size:16px}
.send.ws{background:linear-gradient(135deg,var(--ws),var(--spark))}
.for{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted)}
.for-chip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in oklab,var(--ws) 12%,var(--surface));color:var(--ink);border-radius:99px;padding:3px 10px 3px 4px;font-size:13.5px;font-weight:600}
.for-chip .av{width:24px;height:24px;font-size:11px}
.for-chip .x{width:24px;height:24px;font-size:15px;background:transparent}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px 3px 4px;font-size:14px;font-weight:500;transition:background .2s}
.pick button .av{width:26px;height:26px;font-size:11.5px}
.pick button[aria-pressed="true"]{background:var(--ws);border-color:var(--ws);color:#fff}
.ws-seg button[aria-pressed="true"]{color:var(--ws);font-weight:700}
.ws-seg .num{font-size:12px;opacity:.7}
.status{flex:none;border:0;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:700;transition:background .25s,transform .15s var(--ease)}
.status:active{transform:scale(.92)}
.status.todo{background:var(--bg2);color:var(--muted)}
.status.doing{background:color-mix(in oklab,var(--biz) 22%,transparent);color:color-mix(in oklab,var(--biz),var(--ink) 35%)}
.status.done{background:color-mix(in oklab,var(--ok) 18%,transparent);color:var(--ok)}
.ws-t.is-done .t{text-decoration:line-through;color:var(--muted)}
.flag{color:var(--bad)}
.assg{display:inline-flex;padding-inline-start:7px}
.assg .av{width:24px;height:24px;font-size:10.5px;border:2px solid var(--surface);margin-inline-start:-7px}
.feed{list-style:none;margin:0;padding:6px 14px 10px;display:flex;flex-direction:column}
.feed li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5}
.feed li:first-child{border-top:0}
.feed .av{width:32px;height:32px;font-size:13px}
.feed small{display:block;color:var(--muted);font-size:12px}


.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{border-radius:20px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border:1px solid color-mix(in oklab,var(--c) 18%,var(--line));background:linear-gradient(160deg,color-mix(in oklab,var(--c) 15%,var(--surface)),color-mix(in oklab,var(--c) 6%,var(--surface)))}
.kpi b{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.kpi b small{font-size:16px;font-weight:600;letter-spacing:0}
.kpi span{font-size:13.5px;color:var(--muted);font-weight:500}
.k-work{--c:var(--work)} .k-ws{--c:var(--ws)} .k-personal{--c:var(--personal)} .k-bad{--c:var(--bad)}
.dash{display:flex;flex-direction:column;gap:12px}
.dcard{padding:16px}
.dcard h3{font-size:17px;font-weight:800;margin-bottom:12px}
.dsub{margin:-6px 0 12px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dsub b{color:var(--ink);font-size:20px}
.trend{border-radius:99px;padding:1px 8px;font-weight:700;font-size:12.5px}
.trend.up{background:color-mix(in oklab,var(--ok) 15%,transparent);color:var(--ok)}
.trend.down{background:var(--bad-soft);color:var(--bad)}
.dist{display:flex;gap:10px;min-height:118px}
.dcol{flex-basis:0;min-width:0;position:relative;display:flex;flex-direction:column;padding-inline-start:12px;border-inline-start:2px solid var(--c)}
.dcol::before{content:"";position:absolute;top:-2px;inset-inline-start:-7px;width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--surface)}
.dcol .dl{font-size:13px;color:var(--muted);white-space:nowrap}
.dcol b{font-size:24px;font-weight:700;line-height:1.3}
.dcol i{flex:1;margin-top:8px;min-height:40px;border-radius:10px;background:color-mix(in oklab,var(--c) 12%,var(--surface))}
.pri{display:flex;align-items:center;gap:18px}
.donut{width:130px;height:130px;flex:none}
.lg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1;font-size:14px}
.lg li{display:flex;align-items:center;gap:8px}
.lg li i{width:10px;height:10px;border-radius:50%;flex:none}
.lg li b{margin-inline-start:auto;font-weight:700}
.heat{display:flex;flex-direction:column;gap:5px}
.hrow{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr));gap:5px;align-items:center}
.hrow i{display:block;aspect-ratio:1.25;border-radius:8px;max-width:100%}
.hname .av{width:28px;height:28px;font-size:12px}
.h0{background:var(--bg2)} .h1{background:color-mix(in oklab,var(--ws) 28%,var(--surface))} .h2{background:color-mix(in oklab,var(--ws) 62%,var(--surface))} .h3{background:var(--ws)}
.hdays small{text-align:center;font-size:11.5px;color:var(--muted)}
.hdays small.today{color:var(--ink);font-weight:800}
.wl{display:flex;flex-direction:column;font-size:14px}
.wl-h,.wl-r{display:grid;grid-template-columns:minmax(0,1fr) 46px 50px 86px;gap:6px;align-items:center}
.wl-h{background:var(--bg2);border-radius:12px;padding:8px 10px;font-size:12.5px;color:var(--muted);font-weight:600}
.wl-r{padding:10px;border-bottom:1px solid var(--line)}
.wl-r:last-child{border-bottom:0}
.wl-n{display:flex;align-items:center;gap:8px;min-width:0}
.wl-n>span{display:flex;flex-direction:column;min-width:0}
.wl-n b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-n small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-n .av{width:32px;height:32px;font-size:13px}
.wst{font-style:normal;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.wst::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.wst.ok{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok)}
.wst.press{background:color-mix(in oklab,var(--warn) 16%,transparent);color:var(--warn)}
.wst.over{background:var(--bad-soft);color:var(--bad)}
.wst.idle{background:var(--bg2);color:var(--muted)}


/* dark studio header for the workspace (inspired by dark task dashboards) */
.ws-head{--surface:oklch(24% .045 288);--line:oklch(100% 0 0/.14);--muted:oklch(82% .03 290);--bg2:oklch(100% 0 0/.1);--ink:#fff;color:#fff;border-color:transparent;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in oklab,var(--ws) 55%,transparent),transparent 55%),radial-gradient(90% 70% at 100% 100%,oklch(55% .2 330/.35),transparent 60%),oklch(19% .035 288);box-shadow:0 24px 44px -24px color-mix(in oklab,var(--ws) 80%,black)}
.ws-head::before{display:none}
.ws-head .icon-btn{background:oklch(100% 0 0/.1);border-color:oklch(100% 0 0/.18);color:#fff}
.ws-head .chip{background:oklch(100% 0 0/.08);border-color:oklch(100% 0 0/.18);color:#fff}
.ws-head .chip[aria-pressed="true"]{background:#fff;color:oklch(25% .08 288);border-color:#fff}
.ws-head .field{background:oklch(100% 0 0/.95);color:oklch(22% .03 262)}
.ws-head .btn:not(.invite):not(.primary){background:oklch(100% 0 0/.1);border-color:oklch(100% 0 0/.2);color:#fff}
.ws-head .btn.primary{background:#fff;color:oklch(22% .05 288);border-color:#fff}
.ws-head .invite-note{background:oklch(100% 0 0/.08);border-color:oklch(100% 0 0/.16)}
.ws-head .err{color:oklch(82% .13 27)}
.hello{margin:0 0 2px;font-size:15px;opacity:.9}
.ws-head h2{font-size:30px}
/* day strip with counts */
.ws-days{margin-bottom:10px}
.ws-days .day{position:relative}
.ws-days .cnt{position:absolute;top:-6px;inset-inline-end:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--ws);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.ws-days .day[aria-pressed="true"] .cnt{background:#fff;color:var(--ws)}
.ws-days .day:first-child{margin-inline-start:4px}
.ws-days{padding-top:8px}
/* subtasks progress + comments on cards */
.subp{display:inline-flex;align-items:center;gap:6px}
.subp i{display:block;width:54px;height:6px;border-radius:99px;background:var(--bg2);overflow:hidden}
.subp i b{display:block;height:100%;background:linear-gradient(90deg,var(--ws),var(--spark));border-radius:99px}
.cc{display:inline-flex;align-items:center;gap:3px}
.cc svg{width:15px;height:15px}
.subs{display:flex;flex-direction:column;gap:4px}
.sub{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:10px}
.sub button.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:#fff;padding:0}
.sub button.ck[aria-pressed="true"]{background:var(--ws);border-color:var(--ws)}
.sub button.ck svg{width:13px;height:13px}
.sub span{flex:1;min-width:0;font-size:15px}
.sub.d span{text-decoration:line-through;color:var(--muted)}
.sub .x{width:28px;height:28px;font-size:16px;background:transparent}
.addrow{display:flex;gap:6px}
.addrow .field{flex:1}
.thread{display:flex;flex-direction:column;gap:8px}
.cmt{display:flex;gap:8px;align-items:flex-start}
.cmt .av{width:28px;height:28px;font-size:12px}
.cmt .bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:7px 11px;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.cmt .bub b{font-size:13px}
.cmt .bub small{color:var(--muted);font-size:11.5px;margin-inline-start:6px}
/* team inbox */
.inbox{display:flex;flex-direction:column;gap:10px}
.msg{padding:14px;display:flex;flex-direction:column;gap:8px}
.msg-h{display:flex;align-items:center;gap:10px}
.msg-h .av{width:40px;height:40px;font-size:16px}
.msg-h div{flex:1;min-width:0}
.msg-h b{display:block;font-size:15.5px}
.msg-h small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ws)}
.msg p{margin:0;font-size:15px;line-height:1.7}
.msg .addrow .field{padding:8px 12px;font-size:15px}
.icon-send{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ws);flex:none}
.icon-send svg{width:19px;height:19px}


/* assistant, plan timeline, photo intake */
.assist{padding:16px;display:flex;flex-direction:column;gap:12px}
.assist-h{display:flex;align-items:center;gap:12px}
.assist-h svg{width:48px;height:48px;flex:none}
.assist-h h2{font-size:20px;font-weight:800}
.assist-h p{margin:0;font-size:13.5px;color:var(--muted)}
.tip{margin:0 0 8px;font-size:14.5px;background:color-mix(in oklab,var(--spark) 9%,var(--surface));border-radius:12px;padding:9px 12px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tl li{display:flex;align-items:center;gap:10px}
.tl .tm{width:50px;flex:none;display:flex;flex-direction:column;font-weight:700;font-size:14px;line-height:1.2;direction:ltr;text-align:right}
.tl .tm small{font-weight:500;color:var(--muted);font-size:11.5px}
.tl .blk{flex:1;min-width:0;border-radius:14px;padding:9px 12px;background:color-mix(in oklab,var(--a,var(--muted)) 13%,var(--surface));border-inline-start:4px solid var(--a,var(--line));display:flex;justify-content:space-between;align-items:center;gap:8px}
.tl .blk b{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tl .blk.brk{background:repeating-linear-gradient(-45deg,var(--bg2) 0 6px,transparent 6px 12px);border-inline-start-color:var(--line)}
.tl .blk em{font-style:normal;font-size:11.5px;font-weight:800;background:var(--a,var(--ink));color:#fff;border-radius:99px;padding:1px 8px;flex:none}
.tl li.now .blk{box-shadow:0 0 0 2px var(--a,var(--ink))}
.tl li.past{opacity:.5}
.tl .play{width:36px;height:36px;border-radius:12px}
.foot-acts{display:flex;align-items:center;gap:8px}
.cam{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.cam:hover{color:var(--ink)}
.photo-chip{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:var(--bg2);border-radius:14px;padding:5px 6px 5px 12px;font-size:14px;font-weight:600}
.photo-chip img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.photo-chip .x{width:28px;height:28px;font-size:16px;background:transparent}


/* readability: text on filled area colors follows the theme; violet buttons stay deep */
.chip[aria-pressed="true"],.day[aria-pressed="true"],.day[aria-pressed="true"] b,.tabs button[aria-pressed="true"],.play.on,.pick button[aria-pressed="true"],.tl .blk em,.status-dot{color:var(--on-a)}
.chip[aria-pressed="true"] .dot,.tabs button[aria-pressed="true"] .dot{background:var(--on-a)}
.ws-days .cnt{background:var(--ws-strong);color:#fff}
.switch[data-v="ws"]::before,.btn.invite,.send.ws,.send{background:linear-gradient(135deg,var(--ws-strong),oklch(46% .2 310))}
.mcard.sel{background:radial-gradient(90% 80% at 0% 0%,oklch(55% .2 320/.55),transparent 60%),linear-gradient(150deg,oklch(52% .2 285),oklch(40% .18 285))}
.qa button{color:var(--ws-strong)}
.switch button{white-space:nowrap}
@media (max-width:370px){
  .mini-stack{display:none}
  .gl{padding:8px 9px}
  .gl b{font-size:24px}
  .gl span{white-space:normal;font-size:11.5px;line-height:1.3}
  .hero h1{font-size:36px}
  .kpi b{font-size:28px}
  .wl-h,.wl-r{grid-template-columns:minmax(0,1fr) 38px 44px 78px}
}


/* sync badge, forgotten tasks, focus mode, search, backup */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--bg2);color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--ok);background:color-mix(in oklab,var(--ok) 12%,transparent)}
.sync.busy{color:var(--warn)}
.sync.busy::before{animation:bob 1s ease-in-out infinite}
.sync.local{color:var(--warn);background:color-mix(in oklab,var(--warn) 12%,transparent)}
.pulse-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.forgot{padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid color-mix(in oklab,var(--biz) 40%,var(--line));background:linear-gradient(160deg,color-mix(in oklab,var(--biz) 9%,var(--surface)),var(--surface))}
.fg-h{display:flex;align-items:center;gap:10px}
.fg-h svg{width:40px;height:40px;flex:none}
.fg-h h2{font-size:18px;font-weight:800}
.fg-h p{margin:0;font-size:13px;color:var(--muted)}
.fg-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px dashed var(--line)}
.fg-r .tile{width:38px;height:38px;border-radius:12px}
.fg-r .tile .ico{width:18px;height:18px}
.fg-r .content{flex:1;min-width:120px}
.fg-r .t{font-size:15px}
.fg-r .row-opts{margin-inline-start:auto}
.tabs .tool{border-style:dashed}
.tabs .tool svg{width:16px;height:16px}
.searchbar{position:relative}
.searchbar .field{padding-inline-start:40px;border-radius:16px;font-size:16px}
.searchbar svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
body.focus #assist,body.focus #pulse,body.focus #ai,body.focus #done,body.focus #forgot{display:none}
.focus-note{font-size:13.5px;color:var(--muted);text-align:center;margin:-8px 0 0}
.backup{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--bg2)}
.backup b{font-size:15px}
.backup span{font-size:13.5px;color:var(--muted)}
label.btn{cursor:pointer}

.view>:empty,#settings:empty,#banner:empty{display:none}

/* progress ring, streak, achievements log, coach */
.ring-row{display:flex;align-items:center;gap:14px}
.ring-svg{flex:none}
.ring-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ring-txt .big{font-size:26px}
.ring-txt .sub{font-size:13.5px;color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px 3px 6px;font-size:13.5px;font-weight:700;background:color-mix(in oklab,var(--biz) 16%,var(--surface));color:color-mix(in oklab,var(--biz),var(--ink) 35%);width:fit-content}
.streak svg{width:18px;height:18px;color:var(--biz)}
.streak.off{background:var(--bg2);color:var(--muted)}
.streak.off svg{color:var(--muted)}
.streak small{font-weight:500;opacity:.8}
.hero-streak{margin:8px 0 0;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;background:oklch(100% 0 0/.16);border:1px solid oklch(100% 0 0/.3);border-radius:99px;padding:3px 11px 3px 7px;backdrop-filter:blur(10px)}
.hero-streak svg{width:17px;height:17px;color:#FFC46B}
.log{padding:16px;display:flex;flex-direction:column;gap:12px}
.lstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lstats>div{background:var(--bg2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lstats b{font-size:22px;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lstats span{font-size:12px;color:var(--muted);line-height:1.4}
.lstats .trend{font-size:11px;padding:0 6px;margin-inline-start:2px}
.heat13{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.hc{display:block;aspect-ratio:1;border-radius:5px;border:0;padding:0;background:var(--bg2);min-width:0}
.hc.future{background:transparent;border:1px dashed var(--line)}
.hc.l1{background:color-mix(in oklab,var(--personal) 30%,var(--surface))} .hc.l2{background:color-mix(in oklab,var(--personal) 55%,var(--surface))} .hc.l3{background:color-mix(in oklab,var(--personal) 80%,var(--surface))} .hc.l4{background:color-mix(in oklab,var(--personal),var(--work) 40%)}
.hc.today{outline:2px solid var(--ink);outline-offset:1px}
.hc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--work)}
.hkey{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11.5px;color:var(--muted)}
.hkey .hc{width:12px;height:12px;aspect-ratio:auto}
.hkey span{margin-inline:4px}
.lday{background:var(--bg2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.lday b{font-size:14px}
.lday ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:2px}
.coach{white-space:pre-wrap;background:color-mix(in oklab,var(--spark) 7%,var(--surface));border:1px solid color-mix(in oklab,var(--spark) 25%,var(--line));border-radius:14px;padding:14px;font-size:15px;line-height:1.85}
.coach:empty{display:none}
.coach-meta{font-size:12.5px;color:var(--muted);margin:0}


.stabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:2px}
html{overflow-anchor:none}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.stabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.area-set .row-opts.top{justify-content:space-between;flex-wrap:nowrap;align-items:flex-end}
.area-set .row-opts.top label{flex:1;min-width:0}
.sws{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;background:var(--sw);padding:0;transition:transform .15s var(--ease)}
.sw[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.15)}
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.skin{border:1.5px solid var(--line);border-radius:16px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:8px;text-align:start}
.skin[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px color-mix(in oklab,var(--ink) 20%,transparent)}
.skin .prev{height:46px;border-radius:10px;position:relative;overflow:hidden}
.skin .prev i{position:absolute;bottom:6px;width:16px;height:16px;border-radius:50%}
.skin b{font-size:15px}
.skin small{color:var(--muted);font-size:12.5px}
.wdays{display:flex;gap:5px}
.wdays button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;font-size:13px;font-weight:600}
.wdays button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet section{display:flex;flex-direction:column;gap:12px}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.sheet label{display:flex;flex-direction:column;gap:4px}
.sheet .lbl.strong{color:var(--ink);font-weight:700;font-size:14.5px}


/* boards: dark widget-style panels (always dark, like lock-screen widgets) */
.btabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.btabs::-webkit-scrollbar{display:none}
.btabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.btabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{--bgl:oklch(100% 0 0/.12);--txt:#fff;--dim:oklch(100% 0 0/.6);display:flex;flex-direction:column;gap:10px;color:var(--txt)}
.board .dim{color:var(--dim)}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:oklch(18% .03 262/.92);border-radius:20px;padding:10px 6px;box-shadow:var(--shadow)}
.wcol{border:0;background:transparent;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border-radius:12px;min-width:0}
.wcol small{font-size:11px;color:var(--dim)}

.stage.sdone .sbody b{text-decoration:line-through;color:var(--muted)}

.snow{font-style:normal;font-size:11.5px;font-weight:800;background:var(--a);color:#fff;border-radius:99px;padding:1px 9px;flex:none}

document.documentElement.lang = "ar"; document.documentElement.dir = "rtl";

const prefs = () => S.settings.prefs || DEFAULT_SETTINGS.prefs;
const WORK_DAYS = () => (prefs().workDays && prefs().workDays.length ? prefs().workDays : [0, 1, 2, 3, 4]);

function applyAreaCss(st) {

const WL = ["ح", "ن", "ث", "ر", "خ", "ج", "س"];
function renderPulse() {

    const v = zeroAreas();
    items.forEach(it => { if (v[it.area] == null) return; v[it.area] += (it.log && it.log[d]) || 0; if (d === t && S.timer.itemId === it.id && iso(new Date(S.timer.startedAt)) === t) v[it.area] += elapsedNow(); });

/* parsing team requests */
function detectDay(p) {
  const now = new Date();
  if (/بعد\s*(?:بكر[ةها]|غد)/.test(p)) return iso(addDays(now, 2));
  if (/بكر[ةها]|بكرا|غد[اًا]?|باكر/.test(p)) return iso(addDays(now, 1));

function normalize(arr) {

    const kind = x.kind === "meeting" ? "meeting" : "task";
    const area = AREAS.includes(x.area) ? x.area : defArea();
    const branch = S.settings.areas[area].branches.includes(x.branch) ? x.branch : "";
    const days = kind === "task" && Array.isArray(x.days) ? [...new Set(x.days.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d) && d >= t))].sort() : [];
    const tm = /^\d{1,2}:\d{2}$/.test(latin(x.time || "")) ? latin(x.time).padStart(5, "0") : "";
    let date = /^\d{4}-\d{2}-\d{2}$/.test(x.date || "") ? x.date : "";
    if (kind === "meeting" && !date) date = defaultMeetingDate(tm);
    const repeat = kind === "task" && Array.isArray(x.repeat) ? [...new Set(x.repeat.map(Number).filter(d => d >= 0 && d <= 6))].sort() : [];
    return { kind, title: x.title.trim().slice(0, 160), area, branch, size: x.size === "big" ? "big" : "small", days: repeat.length ? [] : days, repeat,
      date: kind === "meeting" ? date : "", time: kind === "meeting" ? tm : "",

function localParse(text) {
  const now = new Date(), A = S.settings.areas;
  const parts = latin(text).split(/\n+|[.؟!؛;]+|،|,|\s+(?:وبعدين|وبعد كذا|وكمان|وأيضاً|وايضا|ثم)\s+/).map(s => s.trim()).filter(s => s.length > 2);
  const dayMap = [[/بعد\s*(?:بكر[ةها]|غد[اًا]?)/, 2], [/بكر[ةها]|بكرا|غد[اًا]?|باكر/, 1], [/اليوم|الحين|هالحين/, 0]];
  const wdRe = [/(?:ال)?[أا]حد/, /(?:ال)?[إاأ]?ثنين/, /(?:ال)?ثلاث[اء]+|الثلوث/, /(?:ال)?[أا]ربع[اء]+/, /(?:ال)?خميس/, /(?:ال)?جمع[ةه]/, /(?:ال)?سبت/];
  return parts.map((p, pi) => {
    if (pi > 0) p = p.replace(/^و(?=\S)/, "");
    const days = [];
    let m = null;
    for (const [re, n] of dayMap) if (re.test(p)) { days.push(iso(addDays(now, n))); p.replace(re, ""); break; }
    wdRe.forEach((re, wd) => { if (re.test(p)) { const n = (wd - now.getDay() + 7) % 7; days.push(iso(addDays(now, n))); } });
    let time = "";
    if ((m = p.match(/(?:الساع[ةه]|ساع[ةه])\s*(\d{1,2})(?:[:.](\d{2}))?(?:\s*و\s*(نص|ربع))?/) || p.match(/\b(\d{1,2}):(\d{2})\b/))) {
      let h = +m[1], mi = m[2] ? +m[2] : m[3] === "نص" ? 30 : m[3] === "ربع" ? 15 : 0;
      if (/صباح|الصبح|الفجر/.test(p)) { if (h === 12) h = 0; }
      else if (/مساء|الليل|العصر|المغرب|العشا|بالليل/.test(p) && h < 12) h += 12;
      else if (h >= 1 && h <= 6) h += 12;
      if (h < 24 && mi < 60) time = `${p2(h)}:${p2(mi)}`;
    }
    const isMeet = /اجتماع|اجتمع|لقاء|موعد|ميتن|مقابل[ةه]|زوو?م|ميتينق/.test(p);
    let area = defArea();
    const hit = AREAS.find(k => A[k].branches.some(b => b && p.includes(b)) || (A[k].name.length > 2 && p.includes(A[k].name)));
    if (hit) area = hit;
    else if (/الشغل|الدوام|العمل|المدير|الإدار[ةه]|الادار[ةه]|الزملاء|القسم|الوزار[ةه]|الموظفين/.test(p)) area = "work";
    else if (/مشروع|المتجر|العملاء|العميل|المحل|الطلبات|البزنس|التسويق|المورد|المبيعات/.test(p)) area = "biz";
    const branch = A[area].branches.find(b => b && p.includes(b)) || "";
    let title = p.replace(/(?:الساع[ةه]|ساع[ةه])\s*\d{1,2}(?:[:.]\d{2})?(?:\s*و\s*(?:نص|ربع))?/g, "")
      .replace(/\d{1,2}:\d{2}/g, "")
      .replace(/(^|\s)(?:و?(?:بعد\s*)?بكر[ةها]|و?اليوم|و?ال[أا]حد|و?ال[إاأ]ثنين|و?الاثنين|و?الثلاثاء|و?ال[أا]ربعاء|و?الخميس|و?الجمع[ةه]|و?السبت)(?=\s|$)/g, "$1")
      .replace(/(^|\s)(?:كل\s*يوم|يومي[اًا]?|كل\s*(?:يوم\s*)?(?:ال)?(?:[أا]حد|[إاأ]?ثنين|ثلاث[اء]+|[أا]ربع[اء]+|خميس|جمع[ةه]|سبت))(?=\s|$)/g, "$1")
      .replace(/^(?:و|لازم|أبي|ابي|ابغى|أبغى|ودي|عندي|المفروض|اذكرني|ذكرني)\s+/g, "")
      .replace(/\s{2,}/g, " ").trim();

    const kind = isMeet ? "meeting" : "task";
    let repeat = [];
    if (/كل\s*يوم|يومي[اًا]?/.test(p)) repeat = [0, 1, 2, 3, 4, 5, 6];
    else if (/أيام الدوام|ايام الدوام/.test(p) && /كل|دايم|دائم/.test(p)) repeat = WORK_DAYS();

    const uniq = [...new Set(days)].sort();
    return { kind, title, area, branch, size: /كبير|ضخم|طويل|تقرير|خط[ةه]|دراس[ةه]/.test(p) ? "big" : "small",
      days: kind === "task" ? uniq : [], repeat: kind === "task" ? repeat : [], date: kind === "meeting" ? (uniq[0] || defaultMeetingDate(time)) : "", time: kind === "meeting" ? time : "",
      duration: meetDur(), place: "", ai: matchAi((p.match(/تغريد[ةه]|تويت|منشور|بوست|إيميل|ايميل|بريد|خطاب|خط[ةه]|تقرير|أجند[ةه]|اجند[ةه]/) || [""])[0].replace(/ه$/, "ة")) };
  });
}

    const rg = document.getElementById("run-ring"); if (rg) rg.style.strokeDashoffset = (RING_C * (1 - (elapsedNow() % 60) / 60)).toFixed(2);
    renderPulse();
  }
  if (now.getMinutes() !== lastMin) { lastMin = now.getMinutes(); renderHero(); }
  if (todayIso() !== S.lastDay) { S.lastDay = todayIso(); render(); }
}, 1000);

/* ---------- boot ---------- */
const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
S.settings = mergeSettings(S.settings);
render(); renderParse();
use("sample").then(async s => {
  if (!s && S.standalone && stdCfg().key) s = makeStandaloneSample();
  sample = s; renderAI(); renderAssist(); renderWsReport(); renderAgent();
  if (s) { try { const lim = await s.limits(); canImages = !!(lim && lim.images); } catch (e) { canImages = false; } renderPhotoChips(); }
});
use("downloads").then(d => { downloads = d || (S.standalone ? standaloneDownloads : null); renderAssist(); renderWsReport(); renderBoards(); });
use("user").then(async u => {
  user = u;
  if (!u) { S.isOwner = true; S.whoKnown = true; bootData(); render(); return; }
  S.isOwner = await u.isOwner(); S.myId = await u.id();
  try { S.canShared = await u.can("data.write"); } catch (e) { S.canShared = null; }
  try { const me = await u.me(); S.meName = (me && me.name || "").split(" ")[0]; } catch (e) {}
  S.whoKnown = true; bootData();
  render(); syncProfiles(); ensureMembership();
});
use("room").then(r => {
  room = r; if (!r) return;
  try { r.presence({ here: 1 }).catch(() => {}); } catch (e) {}
  r.on("nudge", msg => {
    const d = msg && msg.data; if (!d || d.to !== S.myId || msg.isMe) return;
    const m = S.ws.members[d.from];
    showToast(`${m ? memberName(m) : "زميلك"} ينبّهك: شيك على مهامك في ورك سبيس`, null);
    try { navigator.vibrate && navigator.vibrate([20, 60, 20]); } catch (e) {}
  }, () => {});
  r.onPeers(ch => { S.online = new Set(ch.peers.filter(pp => pp.kind === "viewer" && pp.by).map(pp => pp.by)); render(); }, () => {});
});
use("db").then(d => { db = d; S.dbKnown = true; bootData(); });
function loadLocal() {
  try { const o = JSON.parse(localStorage.getItem("daftar:data") || "null"); if (o) { S.items = o.items || {}; S.timer = o.timer || S.timer; S.settings = mergeSettings(o.settings); if (o.plan) S.plan = o.plan; if (o.hist) S.hist = o.hist; if (o.projects) S.projects = o.projects; if (o.coach) { S.coach = o.coach; S.coachText = o.coach.text || ""; } if (!S.sharedOk && o.ws) { S.ws.tasks = o.ws.tasks || {}; S.ws.members = o.ws.members || {}; S.ws.comments = o.ws.comments || {}; S.ws.meta = Object.assign(S.ws.meta, o.ws.meta || {}); } } } catch (e) {}
}
let booted = false;
function bootData() {
  if (booted || !S.dbKnown || !S.whoKnown) return;
  booted = true;
  // A guest may use the owner's shared workspace, but their own notebook always stays on their device.
  S.sharedOk = !!db && S.canShared !== false;
  S.ownStore = !!db && S.isOwner !== false;
  if (!S.ownStore) {
    S.mode = "local"; loadLocal(); S.ready = true;
    if (!S.sharedOk) { S.ws.ready = S.ws.mready = true; }
    S.banner = S.standalone ? "نسخة الويب: بياناتك محفوظة على هذا الجهاز فقط. نزّل نسخة احتياطية من الإعدادات بين فترة وأخرى."
      : "هذي نسختك أنت: مهامك محفوظة على هذا الجهاز وما يشوفها غيرك. نزّل نسخة احتياطية من الإعدادات بين فترة وأخرى.";
  }
  bootStores();
}
function bootStores() {
  if (!db) {
    S.mode = "local"; loadLocal();
    S.ws.ready = S.ws.mready = true;
    S.ready = true; if (!S.banner) S.banner = S.standalone ? "نسخة الويب: بياناتك محفوظة على هذا الجهاز فقط. نزّل نسخة احتياطية من الإعدادات بين فترة وأخرى." : "الحفظ في حسابك غير متاح في هذا العرض، فالبيانات محفوظة على هذا الجهاز فقط.";
    render(); return;
  }
  const lost = () => { S.banner = "انقطع الاتصال بالحفظ. حدّث الصفحة."; render(); };
  if (S.sharedOk) {
    const toMapW = snap => { const o = {}; snap.docs.forEach(d => { const x = d.data(); if (x) o[d.id] = Object.assign({}, x, { id: d.id }); }); return o; };
    db.collection("wsTasks").onSnapshot(snap => { S.ws.tasks = toMapW(snap); S.ws.ready = true; render(); }, lost);
    db.collection("wsMembers").onSnapshot(snap => { S.ws.members = toMapW(snap); S.ws.mready = true; syncProfiles(); ensureMembership(); render(); }, lost);
    db.collection("wsComments").onSnapshot(snap => { S.ws.comments = toMapW(snap); render(); }, lost);
    db.doc("wsMeta/main").onSnapshot(s2 => { if (s2.exists) { S.ws.meta = Object.assign({ name: "ورك سبيس", teams: [] }, s2.data()); render(); } }, lost);
  } else { S.ws.ready = S.ws.mready = true; }
  if (!S.ownStore) { render(); return; }
  S.mode = "db"; syncBadge();
  db.collection("projects").onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { const x = d.data(); if (x) o[d.id] = Object.assign({}, x, { id: d.id }); });
    S.projects = o; render();
  }, lost);
  db.collection("items").onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { const x = d.data(); if (x) o[d.id] = Object.assign({}, x, { id: d.id }); });
    S.items = o; S.ready = true; render();
  }, lost);
  db.doc("state/timer").onSnapshot(s => { S.timer = s.exists ? Object.assign({ itemId: null, startedAt: 0 }, s.data()) : { itemId: null, startedAt: 0 }; render(); }, lost);
  db.doc("state/settings").onSnapshot(s => { if (s.exists) { S.settings = mergeSettings(s.data()); render(); } }, lost);
  db.doc("state/plan").onSnapshot(s => { S.plan = s.exists ? s.data() : null; renderAssist(); }, lost);
  db.doc("state/history").onSnapshot(s => { S.hist = s.exists ? Object.assign({ days: {}, best: 0, total: 0, ms: {} }, s.data()) : null; renderPulse(); renderLog(); renderHero(); }, lost);
  db.doc("state/coach").onSnapshot(s => { if (s.exists) { S.coach = s.data(); if (!S.coachBusy) S.coachText = S.coach.text || ""; renderAssist(); } }, lost);
}
})();
